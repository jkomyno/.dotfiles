name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  doctor:
    name: just doctor (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Ubuntu 24.04
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      # Use the repo's own bootstrap installer so CI exercises the same
      # pinned mise binary that setup.sh installs on a fresh machine.
      - name: Install pinned mise
        run: |
          bash install/common/mise.sh --binary-only
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Install `just` through mise, matching its declared owner in config.toml.
      - name: Install just
        run: |
          mise use -g just@latest
          echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"

      - name: Install Linux syntax-check tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          mise install aqua:fish-shell/fish-shell@4.8.1

      - name: Run doctor
        env:
          # mise resolves github:/npm: backends against the GitHub API; the
          # workflow token avoids anonymous rate limits during the lock dry-run.
          GITHUB_TOKEN: ${{ github.token }}
        run: just doctor
