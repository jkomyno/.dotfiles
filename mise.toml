[task_config]
includes = ["tasks"]

[dotfiles]
"~/.config/ccstatusline/settings.json" = { source = "target/home/.config/ccstatusline/settings.json", mode = "symlink" }
"~/.config/ghostty/config" = { source = "target/home/.config/ghostty/config", mode = "symlink" }
"~/.config/ghui/config.json" = { source = "target/home/.config/ghui/config.json", mode = "symlink" }
"~/.config/hunk/config.toml" = { source = "target/home/.config/hunk/config.toml", mode = "symlink" }
"~/.config/ripgrep/config" = { source = "target/home/.config/ripgrep/config", mode = "symlink" }
"~/.config/starship.toml" = { source = "target/home/.config/starship.toml", mode = "symlink" }
"~/.config/tmux/tmux.conf" = { source = "target/home/.config/tmux/tmux.conf", mode = "symlink" }
