# Fail loudly on a mise older than the pinned bootstrap version (see
# install/common/mise.sh), which is the oldest release known to expose the
# experimental [dotfiles] features this repo relies on.
min_version = "2026.6.14"

# The [dotfiles] feature is still experimental in mise, so enable it here rather
# than making every caller prefix commands with MISE_EXPERIMENTAL=true.
[settings]
experimental = true

[task_config]
includes = ["tasks"]

[dotfiles]
"~/.zprofile" = { source = "target/home/.zprofile", mode = "template" }
"~/.zshenv" = { source = "target/home/.zshenv", mode = "symlink" }
