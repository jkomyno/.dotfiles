# Curated Codex CLI configuration. Codex appends machine-local state to the
# deployed ~/.codex/config.toml at runtime (per-project [projects.*] trust
# entries, [notice.*] migrations, [tui.*] flags); that state is intentionally
# not tracked here.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
model_reasoning_summary = "concise"
model_verbosity = "low"
personality = "pragmatic"
service_tier = "default"

# Codex is updated through mise (just update codex). Its npm self-updater
# targets the active Node prefix instead of mise's isolated package install.
check_for_update_on_startup = false

[features]
terminal_resize_reflow = true
memories = true
mentions_v2 = true
prevent_idle_sleep = true

[features.code_mode]
enabled = true

# Curated MCP servers. Codex appends machine-local [mcp_servers.*] at runtime
# (e.g. the Codex.app node_repl browser bridge). Linear's remote MCP (streamable HTTP, OAuth handled in-app)
# lets Codex read and update Linear issues.
[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"

[mcp_servers.lean-lsp]
command = "lean-lsp-mcp"

[mcp_servers.marked]
url = "https://marked.dev/api/mcp"
