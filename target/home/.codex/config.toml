# Curated Codex CLI configuration. Codex appends machine-local state to the
# deployed ~/.codex/config.toml at runtime (per-project [projects.*] trust
# entries, [notice.*] migrations, [tui.*] flags); that state is intentionally
# not tracked here.
model = "gpt-5.5"
model_reasoning_effort = "xhigh"
personality = "pragmatic"
service_tier = "fast"

# Auto-commit checkpoint on turn completion, shared with Claude Code + pi.
# Codex fires this on the `agent-turn-complete` event with the event JSON as an
# argv arg; the wrapper filters + delegates to ~/.agents/bin/agent-checkpoint.sh.
# Absolute path required: Codex does not expand ~ or $HOME inside the argv array.
notify = ["/Users/jkomyno/.agents/bin/codex-notify.sh"]

[features]
rmcp_client = true
terminal_resize_reflow = true
memories = true
mentions_v2 = true
prevent_idle_sleep = true

# Curated MCP servers. Codex appends machine-local [mcp_servers.*] at runtime
# (e.g. the Codex.app node_repl browser bridge); only portable, hosted servers
# are tracked here. Linear's remote MCP (streamable HTTP, OAuth handled in-app)
# lets Codex read and update Linear issues. Requires features.rmcp_client above.
[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
