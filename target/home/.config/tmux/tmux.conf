# tmux configuration, deployed to ~/.config/tmux/tmux.conf.
#
# NOTE: tmux only reads this file when ~/.tmux.conf does NOT exist; delete the
# legacy ~/.tmux.conf after the first dotfiles apply.
#
# Layout inspired by dmmulroy's tmux.conf; trimmed to a learnable baseline.
#
# Cheatsheet (prefix is C-b):
#   prefix c        new window (in current path)     prefix \   split right
#   prefix Enter    split below                      prefix x   kill pane
#   prefix 1..9     jump to window                   prefix m   maximize pane
#   prefix v        copy mode (vi keys, y = yank)    prefix r   reload config
#   prefix d        detach; `tmux attach` resumes

# ── Sensible defaults ────────────────────────────────────────────────────────
# Remove the delay after Escape (noticeable in vim and copy mode).
set -s escape-time 0
# Keep far more scrollback than the 2000-line default.
set -g history-limit 50000
# Show status messages long enough to read them.
set -g display-time 4000
# True color and proper terminfo inside tmux (Ghostty supports both).
set -g default-terminal "tmux-256color"
set -as terminal-features 'xterm*:RGB:clipboard:focus:title'
# Let apps inside tmux (nvim, fish) react to focus changes.
set -g focus-events on
# Forward modifier-rich keys (e.g. Shift+Enter) to apps that ask for them.
set -s extended-keys on
# Resize to the smallest client actually viewing the window, not the session.
setw -g aggressive-resize on

# ── Personal settings ────────────────────────────────────────────────────────
set -g mouse on
# Sane scrolling: wheel enters copy mode in normal panes, but passes scroll
# events through to full-screen apps (less, vim) that handle the mouse.
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# ── Windows and panes ────────────────────────────────────────────────────────
# Number from 1 (matches keyboard order) and renumber when windows close.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# Splits and new windows inherit the current pane's working directory.
unbind %
unbind '"'
bind \\ split-window -h -c "#{pane_current_path}"
bind Enter split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x kill-pane
# m toggles pane zoom (easier to remember than the default z).
unbind z
bind m resize-pane -Z
# Repeatable pane resizing: hold prefix once, then tap -/=/[/].
bind -r - resize-pane -D 2
bind -r = resize-pane -U 2
bind -r [ resize-pane -L 2
bind -r ] resize-pane -R 2

# ── Copy mode (vi flavored, macOS clipboard) ─────────────────────────────────
setw -g mode-keys vi
bind v copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi q send-keys -X cancel
# Mouse selection copies without leaving copy mode.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"

# ── Status bar ───────────────────────────────────────────────────────────────
set -g status-position top
set -g status-interval 5

# ── Quality of life ──────────────────────────────────────────────────────────
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded 🚀"

# ── Plugins (TPM) ────────────────────────────────────────────────────────────
# Mutable plugin checkouts live outside the managed config tree.
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.local/share/tmux/plugins"

set -g @plugin 'tmux-plugins/tpm'
# Catppuccin Macchiato, matching the Ghostty theme.
set -g @plugin 'catppuccin/tmux#v2.1.3'
set -g @catppuccin_flavor 'macchiato'
set -g @catppuccin_window_status_style 'rounded'
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"
set -g status-left ""

# Worth adding once tmux sticks (see dmmulroy's config for reference):
#   tmux-plugins/tmux-resurrect  - save/restore sessions across reboots
#   christoomey/vim-tmux-navigator - C-h/j/k/l moves between vim and tmux panes

# Bootstrap TPM on first start, then install declared plugins.
if "test ! -d ~/.local/share/tmux/plugins/tpm" \
   "run 'mkdir -p ~/.local/share/tmux/plugins && git clone https://github.com/tmux-plugins/tpm ~/.local/share/tmux/plugins/tpm && ~/.local/share/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM (must stay the last line).
run '~/.local/share/tmux/plugins/tpm/tpm'
