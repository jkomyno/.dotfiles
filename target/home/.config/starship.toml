# Starship prompt configuration (shared by zsh and fish)

# Version probes (node, python, ...) can exceed the default 500ms timeout on
# cold caches, which makes starship print a warning into the prompt.
command_timeout = 2000

# Hide cloud profile/region segments
[aws]
disabled = true

[gcloud]
disabled = true

# Nerd Font lambda as the prompt character (green = last command succeeded,
# red = failed). Requires a Nerd Font in the terminal (e.g. Hack Nerd Font).
[character]
error_symbol = "[󰘧](bold red)"
success_symbol = "[󰘧](bold green)"

# Show the full path inside repositories instead of truncating to the repo root
[directory]
truncate_to_repo = false
