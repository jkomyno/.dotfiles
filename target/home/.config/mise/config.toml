[tools]
# Programming languages
node = "24"
python = "3.13"
rust = { version = "1.96.0", targets = "wasm32-unknown-unknown" }
erlang = "29.0.2"
elixir = "1.20.2-otp-29"

# JavaScript and TypeScript tooling
# https://github.com/pnpm/pnpm - fast, disk-efficient JavaScript package manager
"npm:pnpm" = "11"
# https://github.com/oven-sh/bun - JavaScript runtime, package manager, and bundler
bun = "latest"

# Python tooling
# https://github.com/astral-sh/uv - fast Python package and virtualenv manager
uv = "latest"
# https://github.com/astral-sh/ruff - fast Python linter and formatter
ruff = "latest"
# https://github.com/astral-sh/ty - Python type checker
ty = "latest"
# https://nox.thea.codes - Python task automation driven by noxfile.py sessions
"pipx:nox" = "latest"

# Rust tooling
# https://github.com/cargo-bins/cargo-binstall - installs Rust binaries from prebuilt releases
cargo-binstall = "latest"
# https://github.com/wasm-bindgen/wasm-bindgen - Rust and JavaScript WebAssembly bindings
"cargo:wasm-bindgen-cli" = "0.2.123"
# https://github.com/EmbarkStudios/cargo-deny - lints Rust dependency graphs: advisories, licenses, bans, sources
"cargo:cargo-deny" = "latest"
# https://github.com/rustsec/rustsec - audits Cargo.lock against the RustSec advisory database
"cargo:cargo-audit" = "latest"

# Git and GitHub tooling
# https://github.com/cli/cli - GitHub's official command-line tool
gh = "latest"
# https://github.com/kitlangton/ghui - GitHub pull request TUI
"npm:@kitlangton/ghui" = "latest"
# https://github.com/dandavison/delta - syntax-highlighting, side-by-side Git diff pager
delta = "latest"
# https://github.com/git-lfs/git-lfs - Git extension for versioning large files
git-lfs = "latest"
# https://codeberg.org/mergiraf/mergiraf - syntax-aware Git merge driver
"cargo:mergiraf" = "latest"
# https://github.com/modem-dev/hunk - review-first terminal diff viewer
hunk = "latest"

# Shell tooling
# https://github.com/tmux/tmux - terminal multiplexer; config in target/home/.config/tmux
tmux = "latest"
# https://github.com/starship/starship - cross-shell prompt
starship = "latest"
# https://github.com/koalaman/shellcheck - static analysis for shell scripts
shellcheck = "latest"
# https://github.com/mvdan/sh - shell parser, formatter, and interpreter
shfmt = "latest"
# https://github.com/casey/just - command runner for project-local recipes (justfiles)
just = "latest"

# Search and code analysis tools
# https://github.com/BurntSushi/ripgrep - fast recursive text search
ripgrep = "latest"
# https://github.com/sharkdp/fd - fast, user-friendly file search
fd = "latest"
# https://github.com/eza-community/eza - modern ls replacement
eza = "latest"
# https://github.com/sharkdp/bat - cat clone with syntax highlighting and git integration
bat = "latest"
# https://github.com/junegunn/fzf - command-line fuzzy finder
fzf = "latest"
# https://github.com/neovim/neovim - programmable terminal editor; config in target/home/.config/nvim
neovim = "latest"
# https://github.com/ast-grep/ast-grep - AST-based code search and rewrite
ast-grep = "latest"

# AI agent tooling
# https://github.com/openai/codex - OpenAI Codex CLI coding agent;
# global config and shared-agent adapter tracked in target/home/.codex
"npm:@openai/codex" = "latest"
# https://github.com/earendil-works/pi (https://pi.dev) - Pi, a minimal extensible coding agent;
# global config and skills wiring tracked in target/home/.pi
"npm:@earendil-works/pi-coding-agent" = "latest"
# https://github.com/rohitg00/agentmemory - shared persistent memory server for coding agents;
# Claude/Codex plugins and pi extension wiring are tracked in the agent dotfiles
"npm:@agentmemory/agentmemory" = "latest"
# https://github.com/rtk-ai/rtk - rewrites agent shell commands into token-efficient equivalents;
# required by the Claude Code PreToolUse hook in target/home/.claude/hooks/rtk-rewrite.sh
"github:rtk-ai/rtk" = "latest"
# https://github.com/sirmalloc/ccstatusline - Claude Code status line renderer;
# wired up via statusLine in target/home/.claude/settings.json, configured by target/home/.config/ccstatusline
"npm:ccstatusline" = "latest"
# https://github.com/ryoppippi/ccusage - Claude Code usage/cost reporter; feeds the
# first status line via the custom-command widget in target/home/.config/ccstatusline/settings.json
"npm:ccusage" = "latest"
# https://paseo.sh - run local coding agents (Claude Code, Codex, pi) from the phone/web app;
# the always-on daemon is a tracked LaunchAgent (target/home/Library/LaunchAgents/sh.paseo.daemon.plist)
# loaded by install/common/paseo.sh, reachable from the phone over Tailscale
"npm:@getpaseo/cli" = "latest"

# Local LLM tooling
# https://github.com/ollama/ollama - run large language models locally; `ollama serve` hosts the API
ollama = "latest"
# mlx-lm (`mlx_lm.server`, the MLX-first OpenAI-compatible local LLM runtime) is NOT a mise
# tool: it is Apple-Silicon-only, so it is installed via `uv tool` by the guarded
# install/common/mlx.sh provisioning script rather than this cross-platform manifest.

# Terminal recording
# https://github.com/agentstation/vhs - charmbracelet/vhs fork with SVG output; scripted terminal
# demo recordings for READMEs. The registry short name `vhs` resolves to the upstream
# charmbracelet build, so the fork is pinned through the github backend explicitly.
"github:agentstation/vhs" = "latest"
# ttyd (vhs's recording driver) is NOT here: upstream publishes no macOS arm64
# binaries, so it lives in install/macos/common/nanobrew-formulae.Brewfile.

# Productivity and file-format tools
# https://github.com/jqlang/jq - command-line JSON processor
jq = "latest"
# https://github.com/tamasfe/taplo - TOML formatter and language server
taplo = "latest"
# https://github.com/crate-ci/typos - source-code spell checker
typos = "latest"
# https://github.com/jkomyno/uniku - unique ID generator CLI, compatible with every modern JS runtime;
# version_prefix restricts "latest" to uniku-cli-v* release tags, since the repo also
# tags unrelated library releases (e.g. bare "0.0.12", "@uniku/cli@0.0.12")
"github:jkomyno/uniku" = { version = "latest", version_prefix = "uniku-cli-v" }

[settings]
# Enable the experimental [dotfiles] feature so `mise dotfiles ...` works from
# any shell without a MISE_EXPERIMENTAL=true prefix.
experimental = true
idiomatic_version_file_enable_tools = ["node", "python", "rust"]

[settings.node]
corepack = true

[settings.python]
uv_venv_auto = "source"

# Encrypted environment variables via age (experimental; requires experimental=true above).
# `mise set --age-encrypt --prompt SECRET` stores SECRET encrypted inline in a project's
# mise.toml as `SECRET = { age = "..." }`, and mise decrypts it automatically at runtime.
# We use the Ed25519 SSH key at ~/.ssh/id_ed25519 as the age identity (recipient for
# encryption, private key for decryption) rather than an age-keygen key file: a
# passphrase-protected SSH key can live in the macOS Keychain and is never stored in
# plaintext, whereas ~/.config/mise/age.txt would sit on disk unprotected.
# Setup and the "just works on a new machine" caveats: docs/encrypted-secrets.md
[settings.age]
ssh_identity_files = ["~/.ssh/id_ed25519"]
