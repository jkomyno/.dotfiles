min_version = "2026.11.8"
# Keep essentials ahead of web so standalone npm and pnpm win over Node and Corepack.
# Resolve the source path so an existing global symlink works immediately after pulling.
include = [
  "{{ config_source | canonicalize | dirname }}/bundles/essentials.toml",
  "{% set dir = config_source | canonicalize | dirname | quote %}{{ exec(command='bash ' ~ dir ~ '/dotfiles-profile.sh include web') }}",
  "{% set dir = config_source | canonicalize | dirname | quote %}{{ exec(command='bash ' ~ dir ~ '/dotfiles-profile.sh include go') }}",
  "{% set dir = config_source | canonicalize | dirname | quote %}{{ exec(command='bash ' ~ dir ~ '/dotfiles-profile.sh include system-engineering') }}",
  "{% set dir = config_source | canonicalize | dirname | quote %}{{ exec(command='bash ' ~ dir ~ '/dotfiles-profile.sh include machine-learning') }}",
  "{% set dir = config_source | canonicalize | dirname | quote %}{{ exec(command='bash ' ~ dir ~ '/dotfiles-profile.sh include personal-extras') }}",
  "{% set dir = config_source | canonicalize | dirname | quote %}{{ exec(command='bash ' ~ dir ~ '/dotfiles-profile.sh include splash') }}",
]

# Installing global tools, including on-demand shell activation, must preserve
# the repository lock. Each project's tools retain their own lock policy.
[tool_config]
locked = true

[settings]
# Direct age encryption remains experimental and requires this opt-in.
experimental = true
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]
# Disable mise's release-age cooldown for fuzzy versions such as "latest".
minimum_release_age = "0s"
idiomatic_version_file_enable_tools = ["node", "python", "rust"]

[settings.node]
corepack = true

[settings.python]
uv_venv_auto = "source"

# Encrypted environment variables via age (experimental; requires experimental=true above).
# `mise set --age-encrypt --prompt SECRET` stores SECRET encrypted inline in a project's
# mise.toml as `SECRET = { age = "..." }`, and mise decrypts it automatically at runtime.
# We use the Ed25519 SSH key at ~/.ssh/id_ed25519 as the age identity (recipient for
# encryption, private key for decryption) rather than an age-keygen key file: a
# passphrase-protected SSH key can live in the macOS Keychain and is never stored in
# plaintext, whereas ~/.config/mise/age.txt would sit on disk unprotected.
# Setup and the "just works on a new machine" caveats: docs/encrypted-secrets.md
[settings.age]
ssh_identity_files = ["~/.ssh/id_ed25519"]

# Fetch GitHub API requests through the gh CLI's stored auth instead of going
# unauthenticated, which hits GitHub's ~60 req/hr rate limit fast (self-update
# checks, github: backend tools, lock refreshes). gh's own token lives in the
# macOS Keychain rather than ~/.config/gh/hosts.yml, so mise's built-in
# github.gh_cli_tokens hosts.yml reader can't see it; shelling out to
# `gh auth token` on demand is the fix. Scoped to mise only (not a blanket
# GITHUB_TOKEN env var) so it can't leak into other tools that special-case
# that variable.
[settings.github]
credential_command = "gh auth token"
